name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from commit message
        id: version
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          TITLE_LINE=$(echo "$COMMIT_MSG" | head -n1)
          VERSION=$(echo "$TITLE_LINE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)

          if [ -z "$VERSION" ]; then
            echo "Commit poruka ne sadrži verziju (npr. v1.0.1) - preskačem release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION već postoji - preskačem release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES=$(echo "$COMMIT_MSG" | tail -n +2)

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish build
        if: steps.version.outputs.should_release == 'true'
        run: dotnet publish Software/PassNest/PassNest.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Create tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.version }} publish/PassNest.exe --title "PassNest ${{ steps.version.outputs.version }}" --notes "${{ steps.version.outputs.notes }}"
